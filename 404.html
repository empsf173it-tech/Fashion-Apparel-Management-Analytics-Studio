<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VogueMetrics | Page Not Found</title>
  <meta name="theme-color" content="#14110E">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><img src="assets/images/voguemetrics-logo.svg" alt="VogueMetrics"></a>
      <div class="nav-actions">
        <button class="theme-toggle" aria-label="Toggle dark mode"></button>
        <a href="favorites.html" class="nav-icon desk-only" aria-label="Favorites"><i class="ph ph-heart"></i></a>
        <a href="cart.html" class="nav-icon" aria-label="Cart"><i class="ph ph-shopping-bag"></i></a>
      </div>
    </div>
  </header>

  <main class="error-page">
    <div class="container">
      <span class="eyebrow centered animate-fade-in">Error 404</span>
      <div class="error-code animate-fade-in delay-1">404</div>
      <h1 class="animate-fade-in delay-1">This page has been retired</h1>
      <p class="subtext animate-fade-in delay-2">
        The page you're looking for may have moved, changed name, or sold out of existence.
        The collection, however, is exactly where you left it.
      </p>
      <div class="hero-actions animate-fade-in delay-3" style="justify-content:center">
        <a href="index.html" class="btn btn-primary">Return Home</a>
        <a href="shop.html" class="btn btn-outline">Browse the Collection</a>
      </div>
    </div>
  </main>
  <button class="back-to-top" type="button" aria-label="Back to top"><i class="ph ph-arrow-up"></i></button>


  <script src="assets/js/main.js"></script>
</body>
</html>
