<svg width="450" height="70" viewBox="0 -6 450 76" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VOGUEMETRICS">
  <title>VOGUEMETRICS</title>

  <!-- Icon: minimal clothing hanger with a soft radiating glow, in VOGUEMETRICS's brass-gold -->
  <g fill="none" stroke="#9A7B4B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">

    <!-- subtle VOGUEMETRICS / glow arcs above the hook -->
    <path d="M22 9 C22 4.5 26 1.5 30 1.5" opacity="0.55"/>
    <path d="M38 9 C38 4.5 34 1.5 30 1.5" opacity="0.55"/>
    <path d="M16 13 C16 6 22.5 -1 30 -1" opacity="0.3"/>
    <path d="M44 13 C44 6 37.5 -1 30 -1" opacity="0.3"/>

    <!-- hook -->
    <path d="M25.5 15 A4.5 4.5 0 1 1 34.5 15"/>
    <!-- neck -->
    <line x1="30" y1="15" x2="30" y2="23"/>
    <!-- hanger body / garment silhouette -->
    <path d="M30 23 L9 42 C7.3 43.6 8.4 46.5 10.7 46.5 L49.3 46.5 C51.6 46.5 52.7 43.6 51 42 L30 23 Z"/>
    <!-- collar notch -->
    <path d="M23 30 L30 23 L37 30"/>
    <!-- garment hem line -->
    <line x1="15" y1="52" x2="45" y2="52" stroke-width="2"/>
  </g>

  <!-- Wordmark -->
  <text x="72" y="45"
        font-family="'Bodoni Moda','Playfair Display',Georgia,serif"
        font-size="34"
        font-weight="500"
        letter-spacing="6"
        fill="#9A7B4B">VOGUEMETRICS</text>
</svg>
