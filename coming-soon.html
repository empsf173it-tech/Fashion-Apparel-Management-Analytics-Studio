<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VogueMetrics | Coming Soon</title>
  <meta name="description" content="VogueMetrics's next chapter is almost here. Subscribe to be notified at launch.">
  <meta name="theme-color" content="#14110E">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="nav-overlay">

  <header class="navbar" style="border-bottom:none;">
    <div class="container">
      <a href="index.html" class="logo"><img src="assets/images/voguemetrics-logo.svg" alt="VogueMetrics"></a>
      <div class="nav-actions">
        <button class="theme-toggle" aria-label="Toggle dark mode"></button>
        <a href="favorites.html" class="nav-icon desk-only" aria-label="Favorites"><i class="ph ph-heart"></i></a>
        <a href="cart.html" class="nav-icon" aria-label="Cart"><i class="ph ph-shopping-bag"></i></a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero light-text">
      <div class="hero-media">
        <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=2000&q=80" alt="VogueMetrics campaign" fetchpriority="high">
      </div>
      <div class="hero-overlay" style="background: linear-gradient(to bottom, rgba(12,10,8,0.6), rgba(12,10,8,0.75));"></div>

      <div class="hero-content centered">
        <span class="eyebrow centered animate-fade-in">Chapter Four</span>
        <h1 class="display animate-fade-in delay-1">Something Beautiful<br><em class="italic-accent">Is Coming</em></h1>
        <p class="subtext animate-fade-in delay-2">
          We're crafting the next VogueMetrics experience. Leave your address and you'll be
          the first through the door.
        </p>

        <div class="countdown animate-fade-in delay-2">
          <div><strong>14</strong><span>Days</span></div>
          <div><strong>08</strong><span>Hours</span></div>
          <div><strong>45</strong><span>Minutes</span></div>
          <div><strong>12</strong><span>Seconds</span></div>
        </div>

        <form class="newsletter-form animate-fade-in delay-3" data-validate="true" novalidate style="margin: 0 auto;">
          <input type="email" class="form-control" placeholder="Enter your email address" aria-label="Email address" required>
          <button type="submit" class="btn btn-light">Notify Me</button>
        </form>
        <p class="newsletter-note">No spam. One message, on launch day.</p>
      </div>
    </section>
  </main>
  <button class="back-to-top" type="button" aria-label="Back to top"><i class="ph ph-arrow-up"></i></button>


  <script src="assets/js/main.js"></script>
