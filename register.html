<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VogueMetrics | Create Account</title>
  <meta name="description" content="Create an VogueMetrics account for private previews, saved pieces and faster checkout.">
  <meta name="theme-color" content="#14110E">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

  <!-- main.js binds these by class, exactly as it does in the navbar -->
  <div class="auth-controls">
    <button class="theme-toggle" aria-label="Toggle dark mode"></button>
        <a href="favorites.html" class="nav-icon desk-only" aria-label="Favorites"><i class="ph ph-heart"></i></a>
        <a href="cart.html" class="nav-icon" aria-label="Cart"><i class="ph ph-shopping-bag"></i></a>
  </div>

  <div class="auth-layout">
    <div class="auth-box animate-fade-in" style="max-width: 520px;">
      <a href="index.html" class="logo" style="display:inline-block; margin-bottom: var(--space-5);"><img src="assets/images/voguemetrics-logo.svg" alt="VogueMetrics"></a>
      <h1>Create Account</h1>
      <p class="subtext">Private previews, first access to limited runs, and faster checkout.</p>

      <form data-validate="true" novalidate>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" class="form-control" required placeholder="Your name">
          <span class="error-msg">This field is required</span>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" required placeholder="you@example.com">
          <span class="error-msg">This field is required</span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input type="password" id="password" name="password" class="form-control" required placeholder="Minimum 8 characters">
            <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false"><i class="ph ph-eye"></i></button>
          </div>
          <span class="error-msg">This field is required</span>
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <div class="password-field">
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" required placeholder="Repeat password">
            <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false"><i class="ph ph-eye"></i></button>
          </div>
          <span class="error-msg">Passwords must match</span>
        </div>

        <div class="form-group checkbox-group" style="text-align:left; margin-bottom: var(--space-5);">
          <input type="checkbox" id="terms" name="terms" required>
          <label for="terms">I accept the <a href="#" class="link-underline">Terms &amp; Conditions</a> and <a href="#" class="link-underline">Privacy Policy</a>.</label>
          <span class="error-msg">You must accept the terms</span>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Create Account</button>
      </form>

      <div class="auth-separator"><span>Or continue with</span></div>

      <button class="btn btn-google">
        <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg"><g transform="matrix(1, 0, 0, 1, 27.009001, -39.238998)"><path fill="#4285F4" d="M -3.264 51.509 C -3.264 50.719 -3.334 49.969 -3.454 49.239 L -14.754 49.239 L -14.754 53.749 L -8.284 53.749 C -8.574 55.229 -9.424 56.479 -10.684 57.329 L -10.684 60.329 L -6.824 60.329 C -4.564 58.239 -3.264 55.159 -3.264 51.509 Z"/><path fill="#34A853" d="M -14.754 63.239 C -11.514 63.239 -8.804 62.159 -6.824 60.329 L -10.684 57.329 C -11.764 58.049 -13.134 58.489 -14.754 58.489 C -17.884 58.489 -20.534 56.379 -21.484 53.529 L -25.464 53.529 L -25.464 56.619 C -23.494 60.539 -19.444 63.239 -14.754 63.239 Z"/><path fill="#FBBC05" d="M -21.484 53.529 C -21.734 52.809 -21.864 52.039 -21.864 51.239 C -21.864 50.439 -21.724 49.669 -21.484 48.949 L -21.484 45.859 L -25.464 45.859 C -26.284 47.479 -26.754 49.299 -26.754 51.239 C -26.754 53.179 -26.284 54.999 -25.464 56.619 L -21.484 53.529 Z"/><path fill="#EA4335" d="M -14.754 43.989 C -12.984 43.989 -11.404 44.599 -10.154 45.789 L -6.734 42.369 C -8.804 40.429 -11.514 39.239 -14.754 39.239 C -19.444 39.239 -23.494 41.939 -25.464 45.859 L -21.484 48.949 C -20.534 46.099 -17.884 43.989 -14.754 43.989 Z"/></g></svg>
        Google
      </button>

      <button class="btn btn-apple">
        <i class="ph ph-apple-logo"></i> Apple
      </button>

      <p class="auth-footnote">
        Already have an account? <a href="login.html" class="link-underline">Sign in</a>
      </p>
    </div>
  </div>
  <button class="back-to-top" type="button" aria-label="Back to top"><i class="ph ph-arrow-up"></i></button>


  <script src="assets/js/main.js"></script>
</body>
</html>
